[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "CoolPlot"
dynamic = ["version"]
description = "Thermodynamic property diagrams with CoolProp as data source."
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Jorrit Wronski", email = "coolplot@jorrit.org"}]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.22",
    "coolprop>=8.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]

[project.optional-dependencies]
# Plotting backends are optional; the core and the SVG backend need neither.
matplotlib = ["matplotlib>=3.8"]
plotly = ["plotly>=5.22"]
# PDF and images from the plotly backend; kaleido also needs Chrome
images = ["plotly>=5.22", "kaleido>=1.0"]
test = ["pytest>=7", "matplotlib>=3.8", "plotly>=5.22"]
# Type checking: tests/test_typing.py runs mypy (skipped without it)
typing = ["mypy>=2.4", "matplotlib>=3.8"]

[project.urls]
Homepage = "https://github.com/CoolProp/CoolPlot"

[tool.setuptools.dynamic]
version = {attr = "coolplot.__version__.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"coolplot" = ["py.typed"]   # the package ships its type annotations (PEP 561)
"coolplot.render" = ["static/*.js"]

[tool.mypy]
# The package ships its annotations (src/coolplot/py.typed); tests/test_typing.py
# runs mypy with this configuration over the package and over the typing checks
# in tests/typing. Unannotated functions are checked too.
files = ["src/coolplot"]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
strict_equality = true

# The modules applications work with are fully annotated, and stay so. More
# modules join this list during 1.x (docs/contributing/typing.md).
[[tool.mypy.overrides]]
module = ["coolplot", "coolplot.chart", "coolplot.diagram", "coolplot.psychrometric", "coolplot.export"]
disallow_untyped_defs = true
disallow_incomplete_defs = true

# Imported only when installed; none of them ships type information
[[tool.mypy.overrides]]
module = ["plotly", "plotly.*", "choreographer.*", "kaleido", "kaleido.*", "coolplot_core"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives a real browser through Playwright (run with --run-browser)",
    "kaleido: writes plotly images or PDF through Kaleido (run with --run-kaleido)",
    "slow: sweeps every line of every diagram type, minutes per fluid (run with --run-slow)",
]
