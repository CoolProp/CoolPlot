# The mypy settings of a project that uses CoolPlot, for tests/test_typing.py.
# Not the package's own settings (those are [tool.mypy] in pyproject.toml):
# with this file mypy finds coolplot as an installed package, as it would
# in an application. The check of public_api.py adds --strict.
[mypy]
check_untyped_defs = True
warn_unused_ignores = True

# plotly ships no type information
[mypy-plotly.*]
ignore_missing_imports = True
