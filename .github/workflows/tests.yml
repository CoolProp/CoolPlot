name: tests

on:
  push:
  pull_request:

# The jobs only read the repository
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", coolprop: "8.0.0"}
          - {python: "3.11", coolprop: "8.0.0"}
          - {python: "3.12", coolprop: "8.0.0"}
          - {python: "3.13", coolprop: "8.0.0"}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "coolprop==${{ matrix.coolprop }}" -e ".[test]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest -v

  core:
    # coolplot-core (cpp/): its own tests, then the whole Python suite through
    # its module, so both paths stay green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core zlib1g-dev locales
          # A locale with a decimal comma, for the test that the writers ignore it
          sudo locale-gen de_DE.UTF-8
          python -m pip install --upgrade pip
          python -m pip install "coolprop==8.0.0" "nanobind==2.12.0" -e ".[test]"
      - name: Build and test the C++ library
        env:
          COOLPLOT_REQUIRE_LOCALE: "1"
        run: |
          cmake -B cpp/build -S cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build -j4
          ./cpp/build/coolplot_core_tests
      - name: Build the Python module
        run: |
          cmake -B cpp/build_py -S cpp -DCMAKE_BUILD_TYPE=Release -DCOOLPLOT_CORE_TESTS=OFF \
                -DCOOLPLOT_CORE_PYTHON=ON -DPython_EXECUTABLE="$(which python)"
          cmake --build cpp/build_py -j4 --target coolplot_core_py
      - name: Test through coolplot-core
        env:
          MPLBACKEND: Agg
          PYTHONPATH: cpp/build_py/python
          COOLPLOT_NATIVE: "1"
        run: |
          python -c "import coolplot_core"
          # A chart the port refuses would be drawn by Python with a warning;
          # here that is an error, so the suite really runs through the port
          python -m pytest -v -W error::coolplot.corelib.CoreFallbackWarning

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt -e ".[test]"
      - name: Build the documentation (warnings are errors, the examples are run)
        env:
          MPLBACKEND: Agg
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
