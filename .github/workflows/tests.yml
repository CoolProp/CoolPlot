name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", coolprop: "8.0.0"}
          - {python: "3.11", coolprop: "8.0.0"}
          - {python: "3.12", coolprop: "8.0.0"}
          - {python: "3.13", coolprop: "8.0.0"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "coolprop==${{ matrix.coolprop }}" -e ".[test]"
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r docs/requirements.txt -e ".[test]"
      - name: Build the documentation (warnings are errors, the examples are run)
        env:
          MPLBACKEND: Agg
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
