name: tests

# The legacy API (0.1.x) with the CoolProp versions it supports. Replaces
# the Travis CI configuration, which no longer runs.

on:
  push:
    branches: ["**"]   # every branch; a version tag runs these tests through release.yml instead
  pull_request:
  workflow_call:       # release.yml runs the whole workflow before it publishes

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python: "3.10", coolprop: "8.0.0"}
          - {python: "3.12", coolprop: "6.8.0"}
          - {python: "3.12", coolprop: "7.2.0"}
          - {python: "3.12", coolprop: "8.0.0"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "coolprop==${{ matrix.coolprop }}" pytest -e .
      - name: Test
        env:
          MPLBACKEND: Agg
        run: python -m pytest -v tests
